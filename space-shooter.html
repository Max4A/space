<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический шутер</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 36px;
            text-align: center;
            display: none;
        }
        #restartBtn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #fff;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="score">Очки: 0</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="gameOver">
        Игра окончена!<br>
        <button id="restartBtn" onclick="restartGame()">Играть снова</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        // Игровые переменные
        let score = 0;
        let gameRunning = true;
        let player, bullets, enemies, particles;
        let keys = {};
        let mouseX = canvas.width / 2;
        let useMouseControl = false;

        // Класс игрока
        class Player {
            constructor() {
                this.width = 50;
                this.height = 30;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 60;
                this.speed = 5;
                this.color = '#00ff00';
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
            }

            update() {
                if (useMouseControl) {
                    this.x = mouseX - this.width / 2;
                    // Ограничение движения по горизонтали
                    if (this.x < 0) this.x = 0;
                    if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                } else {
                    if (keys['ArrowLeft'] && this.x > 0) {
                        this.x -= this.speed;
                    }
                    if (keys['ArrowRight'] && this.x + this.width < canvas.width) {
                        this.x += this.speed;
                    }
                    if (keys['ArrowUp'] && this.y > 0) {
                        this.y -= this.speed;
                    }
                    if (keys['ArrowDown'] && this.y + this.height < canvas.height) {
                        this.y += this.speed;
                    }
                }
            }
        }

        // Класс пули
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 4;
                this.height = 10;
                this.speed = 7;
                this.color = '#ffff00';
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                this.y -= this.speed;
            }
        }

        // Класс врага
        class Enemy {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = Math.random() * 2 + 1;
                this.color = '#ff0000';
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                this.y += this.speed;
            }
        }

        // Класс частиц для взрывов
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 4 - 2;
                this.speedY = Math.random() * 4 - 2;
                this.color = `hsl(${Math.random() * 60 + 10}, 100%, 50%)`;
                this.life = 100;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 2;
                this.size *= 0.95;
            }
        }

        // Инициализация игры
        function init() {
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            gameRunning = true;
            scoreElement.textContent = 'Очки: 0';
            gameOverElement.style.display = 'none';
        }

        // Обработка нажатий клавиш
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && gameRunning) {
                bullets.push(new Bullet(player.x + player.width / 2 - 2, player.y));
            }
            // Отключаем управление мышкой при нажатии клавиш стрелок
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
                useMouseControl = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Обработка движения мыши
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            useMouseControl = true;
        });

        // Обработка клика мыши для стрельбы
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0 && gameRunning) { // Левая кнопка мыши
                bullets.push(new Bullet(player.x + player.width / 2 - 2, player.y));
            }
        });

        // Проверка столкновений
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // Создание частиц взрыва
        function createExplosion(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y));
            }
        }

        // Основной игровой цикл
        function gameLoop() {
            if (!gameRunning) return;

            // Очистка экрана
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Обновление и отрисовка игрока
            player.update();
            player.draw();

            // Обновление и отрисовка пуль
            bullets.forEach((bullet, index) => {
                bullet.update();
                bullet.draw();
                if (bullet.y < 0) {
                    bullets.splice(index, 1);
                }
            });

            // Генерация врагов
            if (Math.random() < 0.02) {
                enemies.push(new Enemy());
            }

            // Обновление и отрисовка врагов
            enemies.forEach((enemy, eIndex) => {
                enemy.update();
                enemy.draw();

                // Проверка столкновения с игроком
                if (checkCollision(player, enemy)) {
                    gameRunning = false;
                    gameOverElement.style.display = 'block';
                    createExplosion(player.x + player.width / 2, player.y + player.height / 2);
                }

                // Проверка столкновения с пулями
                bullets.forEach((bullet, bIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        scoreElement.textContent = 'Очки: ' + score;
                    }
                });

                // Удаление врагов, вышедших за экран
                if (enemy.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                }
            });

            // Обновление и отрисовка частиц
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(gameLoop);
        }

        // Перезапуск игры
        function restartGame() {
            init();
            gameLoop();
        }

        // Запуск игры
        init();
        gameLoop();
    </script>
</body>
</html>
